name: Validate application

on:
  push:
    branches: [ feat/backup-restore-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: TypeScript validation
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: npm run test:unit -- --run --threads=false

      - name: Lint
        run: npm run lint

      - name: Web build
        run: npx vite build

      - name: Electron renderer build
        run: npx vite build --mode electron --base=./
